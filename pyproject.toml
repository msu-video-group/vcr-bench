[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcr-bench"
version = "0.1.0"
description = "Video classifier robustness benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "av>=12.0.0",
  "huggingface_hub>=0.24.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pandas>=2.0.0",
  "scikit-image>=0.22.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "tqdm>=4.66.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
research = [
  "IQA-pytorch>=0.1",
  "Pillow>=10.0.0",
  "diffusers>=0.30.0",
  "einops>=0.7.0",
  "pyiqa>=0.1.8",
  "pywavelets>=1.6.0",
  "scipy>=1.12.0",
  "timm>=0.9.16",
  "transformers>=4.44.0",
  "yacs>=0.1.8",
]
remote = []

[project.scripts]
vcr-bench-attack = "vcr_bench.cli.attack:main"
vcr-bench-artifacts = "vcr_bench.cli.artifacts:main"
vcr-bench-classify = "vcr_bench.cli.classify:main"
vcr-bench-test = "vcr_bench.cli.test:main"
vcr-bench-prepare = "vcr_bench.cli.prepare:main"
vcr-bench-remote = "vcr_bench.remote.cli:main"

[tool.setuptools]
include-package-data = true

# Ship vendored third-party license/notice files inside the wheel so redistribution
# retains the required attribution (see THIRD_PARTY_NOTICES.md).
[tool.setuptools.package-data]
"*" = ["LICENSE", "LICENSE_*", "NOTICE.md", "NOTICE"]

[tool.setuptools.packages.find]
include = ["vcr_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
