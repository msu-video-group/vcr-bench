# Source manifest for scripts/build_demo_dataset.py
#
# The builder queries Wikimedia Commons for each entry's `search` term, keeps only files
# whose license is in `license_allow` (CC0 / public domain by default), trims short clips,
# and pseudo-labels them with the classifier ensemble. `target_class` is the Kinetics-400
# action we are aiming for; the label actually written to the dataset is whatever the
# ensemble agrees on (see require_target_match below).
#
# Licensing: only CC0 / public-domain sources are accepted, so the resulting demo set is
# safe to redistribute (including commercially) with no attribution obligation. Provenance
# (source URL, author, license) is still recorded in PROVENANCE.csv for transparency.
#
# All target_class values below are real Kinetics-400 classes, so K400-trained checkpoints
# apply directly. The list leans on music/instrument classes because CC0 colour footage is
# abundant for them; sports/dance are sparser under a CC0-only filter.

[settings]
# CC0 / public-domain tokens (always accepted, no attribution needed).
license_allow = ["cc0", "publicdomain", "public domain", "pd-self", "pd-user", "no restrictions"]
# Also accept plain CC BY (commercial OK with attribution). ShareAlike / NonCommercial /
# NoDerivatives are still rejected. CC BY clips are listed in ATTRIBUTION.md.
allow_cc_by = true
per_class_target = 5            # clips to keep per class
max_candidates_per_class = 8    # Commons files to download and try per class
clip_seconds = 10.0             # trimmed clip length (Kinetics-like ~10s)
output_fps = 30                 # standardise frame rate so frame counts match (~300 frames)
min_source_seconds = 4.0        # skip sources shorter than this
max_source_mb = 200.0           # skip source files larger than this (avoid full films)
min_source_height = 360         # skip sources below this resolution (Kinetics itself is mostly 360p+)
min_color_satmax = 20.0         # skip B&W clips by peak chroma (B&W ~4-9, colour ~40-99)
confidence_threshold = 0.30     # per-model min top-1 softmax confidence
require_unanimous = true        # all ensemble models that scored a clip must agree on top-1
require_target_match = false    # if true, ensemble top-1 must equal target_class

# Ensemble used for pseudo-labelling (top-3 by Kinetics-400 accuracy in this repo;
# all Apache-2.0 / MIT). Models are loaded one at a time. The largest model
# (InternVideo2-1B) is listed last so that on small GPUs a possible OOM does not affect
# the lighter models that already scored.
[[ensemble]]
model = "umt"
backbone = "vit_large_p16"
weights_dataset = "kinetics400"

[[ensemble]]
model = "tadaformer"
backbone = "large_14"
weights_dataset = "kinetics400"

[[ensemble]]
model = "internvideo2"
backbone = "vit_1b_p14"
weights_dataset = "kinetics400"

# ---------------------------------------------------------------------------
# Target classes (all valid Kinetics-400). ~24 classes x up to 5 clips -> aim ~100.
# Search terms kept simple/broad for higher CC0 yield.
# ---------------------------------------------------------------------------
