# Default suite uses the redistributable CC BY 3.0 `demo` subset so it runs out of the box
# (no manual Kinetics download). Use the *_all_models / k400_test suites with your own videos
# for real benchmark numbers.
[accuracy_suites.default]
dataset = "kinetics400"
dataset_subset = "demo"
num_videos = 8
models = ["x3d", "timesformer", "videomae"]

[accuracy_suites.kinetics400_all_models]
dataset = "kinetics400"
dataset_subset = "k400_test"
num_videos = 10
results_root = "results/accuracy"
models = [
  "actionclip",
  "amd",
  "c2d",
  "csn",
  "i3d",
  "i3dnonlocal",
  "ila",
  "internvideo",
  "internvideo2",
  "mvitv2",
  "onepeace",
  "r2plus1d",
  "slowfast",
  "slowonly",
  "tadaformer",
  "tanet",
  "timesformer",
  "tpn",
  "tsm",
  "tsm_surrogate",
  "tsmnonlocal",
  "tsn",
  "umt",
  "uniformer",
  "uniformerv2",
  "videomae",
  "videomaev2",
  "videoswin",
  "x3d",
]

[attack_suites.default]
dataset = "kinetics400"
dataset_subset = "demo"
num_videos = 8
attack_name = "default_suite"
results_root = "results/remote_attacks"

[[attack_suites.default.entries]]
model = "x3d"
attack = "ifgsm"

[[attack_suites.default.entries]]
model = "timesformer"
attack = "mifgsm"

[[attack_suites.default.entries]]
model = "videomae"
attack = "square"

[attack_suites.vram_ifgsm10_all_classifiers]
dataset = "kinetics400"
dataset_subset = "k400_val"
num_videos = 1
attack_name = "vram_ifgsm10_all_classifiers"
results_root = "results/remote_vram"
vram_profile_root = "results/vram/ifgsm10_all_classifiers"
lite_attack = true

